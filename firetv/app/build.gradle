plugins { id "com.android.application" }

android {
    namespace "dev.flashcrash.tv"
    compileSdk 35

    defaultConfig {
        applicationId "dev.flashcrash.tv"
        minSdk 22          // Fire OS 5+
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "DEFAULT_SERVER", "\"${project.findProperty('flashcrashServer') ?: 'http://192.168.0.206:8000'}\""
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // sideload-friendly; use a real key for the Appstore
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
