<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07090d">
<title>Flash Crash · Play</title>
<style>
  :root { --bg:#07090d; --panel:#121722; --line:#232b38; --text:#e7ecf3; --dim:#7d8899; --up:#22d37e; --down:#ff4d5e; --accent:#ffd23f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 26px; margin: 4px 0 16px; letter-spacing: 1px; }
  h1 .c { color: var(--down); } h1 .b { color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  input, textarea { width: 100%; font: inherit; font-size: 18px; color: var(--text); background: #0b0f16; border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; outline: none; }
  textarea { resize: none; height: 84px; }
  button { font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 16px; font-size: 18px; color: #fff; cursor: pointer; }
  button:active { transform: scale(.97); }
  .primary { background: var(--accent); color: #000; width: 100%; margin-top: 12px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .buy { background: var(--up); color: #000; } .sell { background: var(--down); }
  .ghost { background: #1c2330; color: var(--text); font-size: 15px; padding: 12px 8px; }
  .price { display: flex; justify-content: space-between; align-items: baseline; }
  .price b { font-size: 40px; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; text-align: center; }
  .stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stats small { color: var(--dim); font-size: 12px; text-transform: uppercase; }
  .label { color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; margin: 0 0 10px; }
  .mic { background: #2b1838; width: 64px; flex: 0 0 64px; font-size: 26px; }
  .mic.rec { background: var(--down); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222b3a; padding: 12px 18px; border-radius: 12px;
    font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chips button { flex: 1 1 45%; }
  h1 { display: flex; align-items: center; }
  .help { margin-left: auto; width: 40px; height: 40px; padding: 0; border-radius: 50%; background: #1c2330; color: var(--text); font-size: 18px; }

  /* live market */
  #chart { height: 210px; margin: 0 -6px; }
  .news { margin-top: 10px; font-size: 15px; line-height: 1.35; color: var(--text); }
  .news b { color: #000; background: var(--accent); font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-right: 6px; letter-spacing: 1px; }
  .news.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { background: rgba(255,210,63,.35); } 100% { background: transparent; } }
  #feed { list-style: none; margin: 0; padding: 0; }
  #feed li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.35; animation: tin .3s ease-out; }
  #feed li:last-child { border-bottom: 0; }
  #feed .who { color: var(--dim); font-size: 13px; }
  #feed .act { font-weight: 800; font-size: 13px; margin-left: 6px; }
  #feed li.human { background: #22200c; margin: 0 -8px; padding: 9px 8px; border-radius: 8px; }

  /* tutorial */
  #tut { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; padding: 20px 16px 28px; }
  #tut .top { display: flex; justify-content: space-between; align-items: center; max-width: 480px; width: 100%; margin: 0 auto; }
  #tut .skip { background: none; color: var(--dim); font-size: 15px; padding: 8px; }
  #tut .dots { display: flex; gap: 8px; }
  #tut .dots i { width: 8px; height: 8px; border-radius: 50%; background: #2a3342; transition: all .2s; }
  #tut .dots i.on { background: var(--accent); width: 22px; border-radius: 4px; }
  #tut .stage { flex: 1; display: flex; align-items: center; max-width: 480px; width: 100%; margin: 0 auto; overflow: hidden; }
  #tut .slide { text-align: center; animation: tin .3s ease-out; width: 100%; }
  @keyframes tin { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  #tut .big { font-size: 72px; line-height: 1; margin-bottom: 18px; }
  #tut h2 { font-size: 28px; margin: 0 0 12px; }
  #tut p { color: #b9c2d0; font-size: 18px; line-height: 1.45; margin: 0 auto; max-width: 380px; }
  #tut p b { color: var(--text); }
  #tut .demo { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
  #tut .demo span { padding: 10px 14px; border-radius: 10px; font-weight: 800; font-size: 15px; }
  #tut .next { max-width: 480px; width: 100%; margin: 0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="b">⚡</span>&nbsp;FLASH&nbsp;<span class="c">CRASH</span><button class="help" id="help" title="How to play">?</button></h1>

  <div id="join-card" class="card">
    <p class="label">You vs 300 AI traders</p>
    <input id="name" placeholder="Your name" maxlength="20" autocomplete="off">
    <button class="primary" id="join">Join the market</button>
  </div>

  <div id="game" class="hidden">
    <div class="card">
      <div class="price"><span>$GPU</span><b id="price">–</b><span id="chg">–</span></div>
      <div class="stats">
        <div><b id="cash">–</b><small>Cash</small></div>
        <div><b id="shares">–</b><small>Shares</small></div>
        <div><b id="pnl">–</b><small>P&amp;L</small></div>
        <div><b id="rank">–</b><small>Rank</small></div>
      </div>
    </div>

    <div class="card">
      <div id="chart"></div>
      <div class="news" id="news"><b>NEWS</b><span id="news-text">Waiting for breaking news…</span></div>
    </div>

    <div class="card">
      <p class="label">Trade</p>
      <div class="row"><button class="buy" data-side="buy" data-qty="10">BUY 10</button><button class="sell" data-side="sell" data-qty="10">SELL 10</button></div>
      <div class="row" style="margin-top:10px"><button class="buy" data-side="buy" data-qty="all">BUY ALL IN</button><button class="sell" data-side="sell" data-qty="all">DUMP ALL</button></div>
    </div>

    <div class="card">
      <p class="label">🤖 What the AIs are saying</p>
      <ul id="feed"></ul>
    </div>

    <div class="card">
      <p class="label">Leak breaking news</p>
      <div class="row">
        <textarea id="headline" maxlength="160" placeholder="e.g. GPU CEO caught selling chips to aliens"></textarea>
        <button class="mic" id="mic" title="Speak a headline">🎤</button>
      </div>
      <button class="primary" id="leak">📰 Leak it to the market</button>
      <div class="chips">
        <button class="ghost" data-chip="GPU factory explodes, production halted">🔥 Factory fire</button>
        <button class="ghost" data-chip="GPU smashes earnings, record profit">💰 Record profit</button>
        <button class="ghost" data-chip="Regulators open fraud probe into GPU">⚖️ Fraud probe</button>
        <button class="ghost" data-chip="Mystery whale buying every GPU share">🐋 Whale buying</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div id="tut" class="hidden">
  <div class="top"><div class="dots" id="tut-dots"></div><button class="skip" id="tut-skip">Skip</button></div>
  <div class="stage" id="tut-stage"></div>
  <button class="primary next" id="tut-next">Next</button>
</div>
<template id="tut-slides">
  <div class="slide"><div class="big">⚡</div><h2>You vs 300 AI traders</h2>
    <p>The TV shows a live stock, <b>$GPU</b>, traded by AI bots with personalities: degens, panic sellers, value investors and whales.</p></div>
  <div class="slide"><div class="big">💰</div><h2>Trade from your phone</h2>
    <p>You start with <b>$10,000</b> and <b>50 shares</b> at $100. Buy low, sell high.</p>
    <div class="demo"><span class="buy">BUY 10</span><span class="sell">SELL 10</span></div></div>
  <div class="slide"><div class="big">📰</div><h2>Leak fake news</h2>
    <p>Type a headline or tap 🎤 and <b>say it</b>. It flashes on the TV and <b>every AI reads it</b> and reacts.</p>
    <p style="margin-top:12px;color:var(--accent)">"GPU CEO arrested at the airport"</p></div>
  <div class="slide"><div class="big">🧠</div><h2>The trick</h2>
    <p><b>Buy</b>, leak good news, <b>sell</b> into the spike.<br>Or <b>dump</b>, leak a scandal, <b>buy back</b> after the crash.</p>
    <p style="margin-top:12px">The AIs overreact, then calm down. Time it right.</p></div>
  <div class="slide"><div class="big">🏆</div><h2>Beat the bots</h2>
    <p>Finish with the <b>highest profit %</b>. Watch "Who's winning" on the TV. Your rank is on your phone.</p>
    <p style="margin-top:12px">Tap <b>?</b> any time to see this again.</p></div>
</template>
<script src="/static/vendor/lightweight-charts.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var me = JSON.parse(localStorage.getItem("fc_player") || "null");
  var lastPrice = null;

  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove("show"); }, 2200); }
  function post(url, body) {
    return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || r.status); return j; }); });
  }
  function money(n) { return "$" + Math.round(n).toLocaleString(); }
  function render(p) {
    $("cash").textContent = money(p.cash);
    $("shares").textContent = p.shares;
    $("pnl").textContent = (p.pnl_pct >= 0 ? "+" : "") + p.pnl_pct.toFixed(1) + "%";
    $("pnl").className = p.pnl_pct >= 0 ? "up" : "down";
    $("rank").textContent = "#" + p.rank;
  }
  function start() {
    $("join-card").classList.add("hidden");
    $("game").classList.remove("hidden");
    if (!chart) makeChart();
    refresh();
    setInterval(refresh, 1500);
    connect();
  }
  function refresh() {
    fetch("/api/me/" + me.id).then(function (r) {
      if (r.status === 404) { localStorage.removeItem("fc_player"); location.reload(); return; }
      return r.json().then(render);
    }).catch(function () {});
  }
  // --- live chart + AI chatter (same WebSocket stream the TV uses) ---
  var chart = null, candles = null, lastCandle = 0;
  var TZ = -new Date().getTimezoneOffset() * 60; // chart library renders UTC
  function local(c) { return { time: c.time + TZ, open: c.open, high: c.high, low: c.low, close: c.close }; }
  function makeChart() {
    var el = $("chart");
    chart = LightweightCharts.createChart(el, {
      width: el.clientWidth, height: el.clientHeight,
      layout: { background: { color: "#121722" }, textColor: "#7d8899", fontSize: 11 },
      grid: { vertLines: { visible: false }, horzLines: { color: "#1a212d" } },
      timeScale: { timeVisible: true, secondsVisible: false, borderVisible: false, rightOffset: 2, barSpacing: 6 },
      rightPriceScale: { borderVisible: false },
      handleScroll: false, handleScale: false, crosshair: { mode: 2 },
    });
    candles = chart.addCandlestickSeries({ upColor: "#22d37e", downColor: "#ff4d5e", wickUpColor: "#22d37e", wickDownColor: "#ff4d5e", borderVisible: false });
    window.addEventListener("resize", function () { chart.applyOptions({ width: el.clientWidth }); });
  }
  function pushCandle(c) {
    c = local(c);
    if (c.time < lastCandle) return;
    lastCandle = c.time;
    candles.update(c);
  }
  function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; }
  function showNews(n, fresh) {
    $("news-text").textContent = n.text;
    if (!fresh) return;
    var el = $("news"); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }
  // agents post many times a second; show a readable trickle, players and big trades first
  var queue = [];
  function interest(f) { return f.human ? 1e9 : Math.sqrt(f.filled || f.qty * 0.2) + Math.random() * 6; }
  function addFeed(f) {
    var li = document.createElement("li");
    if (f.human) li.className = "human";
    var cls = f.action === "buy" ? "up" : "down";
    li.innerHTML = '<span class="who">' + esc(f.emoji) + " @" + esc(f.handle) + '</span><span class="act ' + cls + '">' +
      f.action.toUpperCase() + " " + f.qty + "</span><br>" + esc(f.thought);
    var feed = $("feed");
    feed.insertBefore(li, feed.firstChild);
    while (feed.children.length > 6) feed.removeChild(feed.lastChild);
  }
  setInterval(function () {
    if (!queue.length) return;
    var best = 0;
    for (var i = 1; i < queue.length; i++) if (interest(queue[i]) > interest(queue[best])) best = i;
    addFeed(queue.splice(best, 1)[0]);
    queue = queue.filter(function (f) { return f.human || Date.now() / 1000 - f.ts < 12; });
  }, 2000);
  function loadHistory(d) {
    candles.setData(d.candles.map(local));
    lastCandle = 0;
    if (d.candles.length) lastCandle = d.candles[d.candles.length - 1].time + TZ;
    if (d.current) pushCandle(d.current);
    $("feed").innerHTML = ""; queue = [];
    d.feed.filter(function (f) { return f.action !== "hold" && f.qty > 0 && f.thought; }).slice(-4).forEach(addFeed);
    if (d.news.length) showNews(d.news[d.news.length - 1], false);
  }
  function snapshot(s) {
    var el = $("price");
    el.textContent = s.price.toFixed(2);
    if (lastPrice !== null && s.price !== lastPrice) el.className = s.price > lastPrice ? "up" : "down";
    lastPrice = s.price;
    $("chg").textContent = (s.change_pct >= 0 ? "+" : "") + s.change_pct.toFixed(2) + "%";
    $("chg").className = s.change_pct >= 0 ? "up" : "down";
  }
  function connect() {
    var ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.onmessage = function (ev) {
      var m = JSON.parse(ev.data);
      if (m.type === "init" || m.type === "reset") { loadHistory(m.data); snapshot(m.data); }
      else if (m.type === "snapshot") snapshot(m.data);
      else if (m.type === "candle") pushCandle(m.candle);
      else if (m.type === "news") showNews(m.item, true);
      else if (m.type === "feed" && m.item.action !== "hold" && m.item.qty > 0 && (m.item.thought || m.item.human)) {
        queue.push(m.item);
        if (queue.length > 40) { queue.sort(function (a, b) { return interest(b) - interest(a); }); queue.length = 40; }
      }
    };
    ws.onclose = function () { setTimeout(connect, 1500); };
  }

  $("join").onclick = function () {
    var name = $("name").value.trim() || "Player";
    post("/api/join", { name: name }).then(function (p) {
      me = { id: p.id, name: p.name };
      localStorage.setItem("fc_player", JSON.stringify(me));
      start();
    }).catch(function (e) { toast("Couldn't join: " + e.message); });
  };

  Array.prototype.forEach.call(document.querySelectorAll("[data-side]"), function (b) {
    b.onclick = function () {
      var qty = b.getAttribute("data-qty");
      post("/api/trade", { id: me.id, side: b.getAttribute("data-side"), qty: qty === "all" ? "all" : Number(qty) })
        .then(function (r) { render(r); toast(r.filled ? (b.getAttribute("data-side") === "buy" ? "Bought " : "Sold ") + r.filled + " @ $" + r.price.toFixed(2) : "Nothing filled"); })
        .catch(function (e) { toast(e.message); });
    };
  });

  var source = "crowd";
  function leak(text) {
    if (!text.trim()) return toast("Write a headline first");
    post("/api/news", { text: text, author: me.name, source: source })
      .then(function () { $("headline").value = ""; source = "crowd"; toast("📰 Leaked! Watch the TV."); })
      .catch(function (e) { toast(e.message); });
  }
  $("leak").onclick = function () { leak($("headline").value); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-chip]"), function (b) {
    b.onclick = function () { leak(b.getAttribute("data-chip")); };
  });

  // voice leaks: Web Speech API where available (Chrome / Android / Safari)
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) $("mic").style.display = "none";
  $("mic").onclick = function () {
    var rec = new SR();
    rec.lang = "en-US";
    rec.interimResults = true;
    $("mic").classList.add("rec");
    rec.onresult = function (e) {
      $("headline").value = Array.prototype.map.call(e.results, function (r) { return r[0].transcript; }).join("");
      source = "voice";
    };
    rec.onend = function () {
      $("mic").classList.remove("rec");
      if (source === "voice" && $("headline").value.trim()) leak($("headline").value);
    };
    rec.onerror = function (e) { toast("Mic: " + e.error); };
    rec.start();
  };

  if (me) start();

  // --- tutorial: shown the first time a phone scans in, reopened with "?" ---
  var slides = $("tut-slides").content.querySelectorAll(".slide");
  var step = 0;
  function seen(v) {
    try { if (v) localStorage.setItem("fc_tutorial", "1"); return localStorage.getItem("fc_tutorial") === "1"; } catch (e) { return false; }
  }
  function show(i) {
    step = i;
    $("tut-stage").innerHTML = "";
    $("tut-stage").appendChild(slides[i].cloneNode(true));
    $("tut-dots").innerHTML = Array.prototype.map.call(slides, function (_, k) { return k === i ? '<i class="on"></i>' : "<i></i>"; }).join("");
    $("tut-next").textContent = i === slides.length - 1 ? (me ? "Back to the game" : "Let's play") : "Next";
  }
  function openTut() { $("tut").classList.remove("hidden"); show(0); }
  function closeTut() {
    seen(true);
    $("tut").classList.add("hidden");
    if (!me) $("name").focus();
  }
  $("tut-next").onclick = function () { step < slides.length - 1 ? show(step + 1) : closeTut(); };
  $("tut-skip").onclick = closeTut;
  $("help").onclick = openTut;
  var x0 = null;
  $("tut").addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  $("tut").addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (dx < -50 && step < slides.length - 1) show(step + 1);
    else if (dx > 50 && step > 0) show(step - 1);
  });
  if (!seen()) openTut();
})();
</script>
</body>
</html>
