<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Days</title>
<style>body{margin:0;background:#07100c;color:#d8e7dc;font:15px ui-monospace,monospace}.s{max-width:900px;margin:auto;padding:24px}h1{color:#65ff9b}.p{border:1px solid #244b37;background:#0b1811;padding:14px;margin-top:14px}input,button{padding:10px;background:#061009;color:#d8e7dc;border:1px solid #315c43;font:inherit}button{background:#65ff9b;color:#07100c;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #1c3929;text-align:left}.hide{display:none}.err{color:#ff8f8f}</style>
<main class=s><h1>MARKET DAYS</h1><p>Persistent Alpaca paper-market sessions.</p><div class=p><input id=n value="Market Day"><input id=s value="SPY,AAPL,NVDA"><button id=c>Create session</button></div><div id=m class=p>Loading configuration…</div><section id=g class=hide><div class=p><b id=t></b> <button id=a>Run AI paper cycle</button><table><thead><tr><th>Symbol</th><th>Bid</th><th>Ask</th></tr></thead><tbody id=q></tbody></table></div><pre id=e class=p></pre></section></main>
<script>(async()=>{const $=x=>document.getElementById(x);let base="",game;try{base=(await (await fetch("/api/config")).json()).apiBase}catch(_){};if(!base){$("m").className="p err";$("m").textContent="Set MARKET_DAYS_API_URL in Vercel.";return}const api=async(p,o)=>{let r=await fetch(base+p,o),j=await r.json();if(!r.ok)throw Error(j.detail);return j};const paint=x=>{$("t").textContent=x.name+" · "+x.status;$("q").innerHTML=(x.quotes||[]).map(v=>`<tr><td>${v.symbol}</td><td>${v.bid}</td><td>${v.ask}</td></tr>`).join("");$("e").textContent=(x.events||[]).map(v=>v.kind+" "+JSON.stringify(v.payload)).join("\n")||"No events.";$("g").className=""};$("c").onclick=async()=>{try{game=await api("/api/days/games",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("n").value,symbols:$("s").value.split(",")})});paint(await api("/api/days/games/"+game.id))}catch(e){$("m").className="p err";$("m").textContent=e.message}};$("a").onclick=async()=>{try{await api("/api/days/games/"+game.id+"/ai-cycle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({symbol:game.symbols[0]})});paint(await api("/api/days/games/"+game.id))}catch(e){$("m").className="p err";$("m").textContent=e.message}};let c=await api("/api/days/config");$("m").textContent=c.enabled?"Ready. "+(c.paper_trading?"Alpaca paper trading configured.":"Configure Alpaca to trade."):"Configure DATABASE_URL on Railway.";})();</script>
